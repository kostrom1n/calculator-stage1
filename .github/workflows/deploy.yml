name: Update calculator

on:
  push:
    branches: [stage2]

permissions:
  contents: read

concurrency:
  group: calculator-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64, calculator]
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build --pull -t calculator:%GITHUB_SHA% .
          if errorlevel 1 exit /b 1

      - name: Update container
        run: |
          docker ps -a --filter "name=^/calculator-stage2$" --format "{{.Names}}" > container.txt
          if errorlevel 1 exit /b 1
          findstr /x calculator-stage2 container.txt >nul
          if not errorlevel 1 (
            docker rm -f calculator-stage2
            if errorlevel 1 exit /b 1
          )
          docker run -d --name calculator-stage2 -p 127.0.0.1:8001:8000 calculator:%GITHUB_SHA%
          if errorlevel 1 exit /b 1

      - name: Check API
        run: |
          curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors "http://127.0.0.1:8001/add?a=2&b=3" -o response.json
          if errorlevel 1 exit /b 1
          type response.json
          powershell -NoProfile -Command "if ((Get-Content response.json -Raw | ConvertFrom-Json).result -ne 5) { exit 1 }"
          if errorlevel 1 exit /b 1
